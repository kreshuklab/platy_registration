cluster:
  mkdir -p data/pipeline_output/slurm_logs/{rule} &&
  sbatch
    --cpus-per-task={resources.cpus_per_task}
    --ntasks=1
    --time={resources.time}
    --nodes={resources.nodes}
    --job-name={rule}-{wildcards}
    --output=data/pipeline_output/slurm_logs/{rule}/slurm-%j-{rule}-{wildcards}.out
    --error=data/pipeline_output/slurm_logs/{rule}/slurm-%j-{rule}-{wildcards}.err
    --mail-type=BEGIN,END,FAIL
    --mail-user=elena.buglakova@embl.de

    {resources.mem_command}
    {resources.queue_command}

    {resources.gpus_command}
    
default-resources:
  - cpus_per_task=32
  - time="2:00:00" # hh:mm:ss
  - nodes=1
# GPU
  - queue_command="--partition=gpu-el8"
  - gpus_command="--gpus=1"
  - mem_command="--mem-per-gpu=63G"

# CPU
#  - queue_command="--partition=htc-el8"
#  - gpus_command=""
#  - mem_command="--mem=63G"
#  - constraint_command=''
  
restart-times: 0
max-jobs-per-second: 10
max-status-checks-per-second: 1
local-cores: 1
latency-wait: 60
jobs: 500
keep-going: True
rerun-incomplete: True
printshellcmds: True
scheduler: greedy
use-conda: True
cluster-cancel: scancel
printshellcmds: True